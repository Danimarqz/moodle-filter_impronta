name: Secret scan

# Scans the whole commit history for credentials.
#
# The whole history, not just the tip: a secret that was committed and then
# removed is still readable in the repository, and that is exactly the case a
# per-commit scan misses.
#
# History of this job: it had been red since September and the failure was
# never the code. It ran the official gitleaks container, which starts as root,
# while the checked-out workspace belongs to the runner user; git refused to
# read a repository it did not consider safe ("detected dubious ownership") and
# gitleaks scanned 0 bytes, then reported "no leaks found" and failed on the
# empty stderr. A safe.directory line was added to work around it, but the
# directory it declared is the host path, which the container never sees, so the
# workaround could not work.
#
# The container is gone. gitleaks is installed as a plain binary and runs as the
# runner user, so there is no ownership mismatch to work around. That also fixed
# a second problem the workaround was masking: the action's default scan walks
# one commit (--log-opts=-1), which is close to useless for secrets. The scan
# now walks every commit, which is the point of the job.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned rather than `latest`, so the scan cannot change behaviour on a day
  # nobody touched this file.
  GITLEAKS_VERSION: '8.24.2'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd /tmp
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o gitleaks_checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # The published checksum file lists bare filenames, so the download
          # has to keep that name and sit in the working directory for
          # sha256sum --check to find it. A scanner that cannot be trusted to be
          # what it claims is worth nothing.
          grep "$tarball\$" gitleaks_checksums.txt > want.sums
          sha256sum --check --strict want.sums
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan the full history
        run: |
          set -eu
          commits=$(git rev-list --all --count)
          echo "Repository has $commits commits; scanning all of them."
          # Refuse to pass on an empty repository: a green tick that means
          # "nothing was scanned" is worse than a red one, because it is the
          # version you believe. This exact failure is what this job used to do.
          if [ "$commits" -lt 1 ]; then
            echo "::error::No commits to scan; the checkout is not what it should be."
            exit 1
          fi
          # --log-opts=--all walks every branch. Plain `gitleaks git` and the
          # gitleaks-action default both stop at the tip of the current branch
          # (--log-opts=-1), which scans a single commit and calls it a day.
          /tmp/gitleaks git --log-opts=--all --redact --no-banner
