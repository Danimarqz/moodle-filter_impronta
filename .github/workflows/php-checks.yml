name: PHP checks

# Static analysis and unit tests for the Moodle plugin.
#
# The plugin ships no build step (Moodle requires a ZIP that installs without
# composer or shell access), so this job only verifies: syntax, the Moodle
# coding standard, and PHPUnit inside a real Moodle test site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-phpcs:
    name: Syntax + Moodle Code Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, gd, intl
          coverage: none

      - name: Syntax check every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Install Moodle Code Checker
        run: |
          composer global require --quiet moodlehq/moodle-cs
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: Run phpcs with the Moodle standard
        run: |
          phpcs --standard=moodle --extensions=php \
            --ignore=vendor/*,node_modules/* \
            --report=full --report-width=120 .

  phpunit:
    name: PHPUnit against a real Moodle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.5 is the current LTS; 5.1 and 5.2 are the maintained stables.
        # Add branches here as Moodle's support window moves.
        moodle-branch: ['MOODLE_405_STABLE', 'MOODLE_501_STABLE', 'MOODLE_502_STABLE']
        database: [pgsql, mariadb]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: moodle
          MARIADB_USER: moodle
          MARIADB_PASSWORD: moodle
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pmoodle" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, gd, intl, pgsql, mysqli
          coverage: none

      - name: Check out Moodle
        run: |
          git clone --depth 1 --branch ${{ matrix.moodle-branch }} \
            https://github.com/moodle/moodle.git /tmp/moodle

      - name: Place the plugin in the Moodle tree
        run: |
          mkdir -p /tmp/moodle/filter/impronta
          rsync -a --exclude '.git' ./ /tmp/moodle/filter/impronta/

      - name: Configure the test site
        run: |
          mkdir -p /tmp/moodledata && chmod 0777 /tmp/moodledata
          if [ "${{ matrix.database }}" = "pgsql" ]; then
            export DBTYPE=pgsql DBHOST=127.0.0.1 DBNAME=moodle DBUSER=moodle DBPASS=moodle
          else
            export DBTYPE=mariadb DBHOST=127.0.0.1 DBNAME=moodle DBUSER=moodle DBPASS=moodle
          fi
          php /tmp/moodle/admin/cli/install.php \
            --wwwroot=http://localhost --dataroot=/tmp/moodledata \
            --dbtype="$DBTYPE" --dbhost="$DBHOST" --dbname="$DBNAME" \
            --dbuser="$DBUSER" --dbpass="$DBPASS" \
            --fullname=CI --shortname=CI --adminpass=Admin123! \
            --non-interactive --agree-license
          # PHPUnit needs its own dataroot and table prefix in config.php.
          # Without phpunit_dataroot the runner aborts with "Missing
          # $CFG->phpunit_dataroot in config.php, can not run tests!" before
          # running a single test.
          mkdir -p /tmp/moodledata_phpunit && chmod 0777 /tmp/moodledata_phpunit
          {
            echo "\$CFG->phpunit_prefix = 'phpu_';"
            echo "\$CFG->phpunit_dataroot = '/tmp/moodledata_phpunit';"
            echo "\$CFG->debug = 32767;"
            echo "\$CFG->debugdisplay = 1;"
          } >> /tmp/moodle/config.php

      - name: Run the plugin PHPUnit suite
        run: |
          cd /tmp/moodle
          # init.php sets up the phpunit_* tables and rebuilds phpunit.xml from
          # phpunit.xml.dist, which is what registers the <component>_testsuite
          # entry for an installed plugin.
          php admin/tool/phpunit/cli/init.php
          vendor/bin/phpunit --testsuite filter_impronta_testsuite \
            --fail-on-warning --fail-on-notice --fail-on-deprecated

  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
        # The JavaScript tests are dependency-free: they exercise the browser
        # sources directly with the node:test runner, so there is no install.
      - name: Run node:test suite
        run: node --test tests/*.test.js
